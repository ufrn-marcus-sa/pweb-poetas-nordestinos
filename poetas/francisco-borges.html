<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Francisco Borges</title>
    <link rel="stylesheet" href="../estilo.css" />
    <link rel="icon" type="image/x-icon" href="poetas/favicon.png" />
    <script defer src="../script.js"></script>
  </head>
  <body>
    <header class="topo">
      <nav class="menu">
        <a href="../index.html">Início</a>
        <a href="joao-paraibano.html">João Paraibano</a>
        <a href="francisco-borges.html">Francisco Borges</a>
      </nav>
      <h1>Poetas Nordestinos</h1>
    </header>

    <main class="container">
      <section class="receita">
        <div class="poeta">
          <img src="https://www.cut.org.br/images/cache/systemuploadsnewsa5aeb99e727a8197445-320x210xfit-d9d88.jpeg" alt="Retrato de Francisco Borges" />
          <h2>
            <a href="https://www.google.com/search?q=Francisco+Borges+poeta">Francisco Borges</a>
          </h2>
        </div>

        <div class="poema">
          <p>Ao cair da tarde</p>
          <p>O rio me conta histórias</p>
          <p class="mote">De um povo que canta</p>
          <p class="mote">Sem medo da noite.</p>
        </div>
      </section>

      <section class="receita">
        <h3>Receita 4: Ordenando dados</h3>
        <div class="beer-controls">
          <button id="sortBeersBtn">Mostrar cervejas ordenadas</button>
          <button id="shuffleBeersBtn">Embaralhar</button>
        </div>
        <table class="beer-table">
          <thead>
            <tr>
              <th>Cervejas</th>
            </tr>
          </thead>
          <tbody id="beerTableBody"></tbody>
        </table>
      </section>
    </main>
  </body>
</html>
